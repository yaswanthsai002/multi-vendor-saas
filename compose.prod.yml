services:
  postgres:
    image: postgres:17-alpine
    container_name: perigee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: perigee-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: perigee-migrate
    command: ['node_modules/@repo/db/dist/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: perigee-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_API_TOKEN: ${R2_API_TOKEN}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BULK_IMPORTS_BUCKET: ${R2_BULK_IMPORTS_BUCKET}
      R2_PRODUCT_MEDIA_BUCKET: ${R2_PRODUCT_MEDIA_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      CHUNK_SIZE: ${CHUNK_SIZE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          'fetch("http://127.0.0.1:4000/api/health/live").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 60s
      timeout: 2s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: perigee-worker
    command: ['dist/worker.js']
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_API_TOKEN: ${R2_API_TOKEN}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BULK_IMPORTS_BUCKET: ${R2_BULK_IMPORTS_BUCKET}
      R2_PRODUCT_MEDIA_BUCKET: ${R2_PRODUCT_MEDIA_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      CHUNK_SIZE: ${CHUNK_SIZE}

  nginx:
    image: nginx:alpine
    container_name: perigee-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
