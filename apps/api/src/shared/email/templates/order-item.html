<tr>
  <td class="rule" style="padding: 12px 0; border-top: 1px solid #d5d9e0">
    <p
      class="ink"
      style="
        margin: 0;
        font-size: 14px;
        font-weight: bold;
        line-height: 20px;
        color: #1e232d;
        word-wrap: break-word;
      "
    >
      {{name}}
    </p>
    <p class="muted" style="margin: 4px 0 0; font-size: 14px; line-height: 20px; color: #5f6775">
      {{quantity}} &times; &#8377;{{unitPrice}} &middot; Subtotal &#8377;{{subtotal}}{{affected}}
    </p>
  </td>
</tr>
