<!doctype html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{{subject}}</title>
    <!--[if mso
      ]><xml
        ><o:OfficeDocumentSettings
          ><o:AllowPNG /><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings
        ></xml
      ><!
    [endif]-->
    <style>
      :root {
        color-scheme: light dark;
        supported-color-schemes: light dark;
      }
      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      table {
        border-collapse: collapse;
      }
      a {
        text-decoration: underline;
      }
      a[x-apple-data-detectors],
      #MessageViewBody a {
        color: inherit !important;
        font: inherit !important;
      }
      @media screen and (max-width: 600px) {
        .outer {
          padding: 16px 8px !important;
        }
        .padding {
          padding: 24px 20px !important;
        }
        .title {
          font-size: 24px !important;
          line-height: 32px !important;
        }
      }
      @media (prefers-color-scheme: dark) {
        .brand-light {
          display: none !important;
        }
        .brand-dark {
          display: block !important;
          max-height: none !important;
          overflow: visible !important;
        }
        .canvas {
          background-color: #0a0d14 !important;
        }
        .card {
          background-color: #131722 !important;
          border-color: #343b49 !important;
          border-top-color: #e66a45 !important;
        }
        .panel {
          background-color: #191e2a !important;
          border-color: #343b49 !important;
        }
        .ink {
          color: #e4e7ec !important;
        }
        .muted {
          color: #b5bbc6 !important;
        }
        .rule {
          border-color: #343b49 !important;
        }
        .accent {
          color: #e66a45 !important;
        }
        .button {
          background-color: #e66a45 !important;
          border-color: #e66a45 !important;
          color: #1e232d !important;
        }
      }
      [data-ogsc] .brand-light {
        display: none !important;
      }
      [data-ogsc] .brand-dark {
        display: block !important;
        max-height: none !important;
        overflow: visible !important;
      }
      [data-ogsc] .canvas {
        background-color: #0a0d14 !important;
      }
      [data-ogsc] .card {
        background-color: #131722 !important;
        border-color: #343b49 !important;
        border-top-color: #e66a45 !important;
      }
      [data-ogsc] .panel {
        background-color: #191e2a !important;
        border-color: #343b49 !important;
      }
      [data-ogsc] .ink {
        color: #e4e7ec !important;
      }
      [data-ogsc] .muted {
        color: #b5bbc6 !important;
      }
      [data-ogsc] .rule {
        border-color: #343b49 !important;
      }
      [data-ogsc] .accent {
        color: #e66a45 !important;
      }
      [data-ogsc] .button {
        background-color: #e66a45 !important;
        border-color: #e66a45 !important;
        color: #1e232d !important;
      }
    </style>
  </head>
  <body
    class="canvas"
    bgcolor="#ECEFF4"
    style="
      margin: 0;
      padding: 0;
      background-color: #eceff4;
      color: #1e232d;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    "
  >
    <div
      aria-hidden="true"
      style="
        display: none;
        font-size: 1px;
        line-height: 1px;
        color: #eceff4;
        max-height: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        mso-hide: all;
      "
    >
      {{preheader}}
    </div>
    <table
      role="presentation"
      width="100%"
      class="canvas"
      bgcolor="#ECEFF4"
      style="width: 100%; background-color: #eceff4"
    >
      <tr>
        <td align="center" class="outer" style="padding: 40px 16px">
          <!--[if mso]><table role="presentation" width="600" align="center"><tr><td><![endif]-->
          <table
            role="presentation"
            width="100%"
            class="card"
            bgcolor="#F7F9FC"
            style="
              width: 100%;
              max-width: 600px;
              background-color: #f7f9fc;
              border: 1px solid #d5d9e0;
              border-top: 4px solid #b9482a;
            "
          >
            <tr>
              <td class="padding" style="padding: 32px">
                <div style="margin: 0 0 32px">
                  <img
                    class="brand-light"
                    src="cid:perigee-logo-light"
                    width="184"
                    height="56"
                    alt="Perigee"
                    style="display: block; width: 184px; max-width: 100%; height: auto; border: 0"
                  />
                  <!--[if !mso]><!-->
                  <div
                    class="brand-dark"
                    style="display: none; max-height: 0; overflow: hidden; mso-hide: all"
                  >
                    <img
                      src="cid:perigee-logo-dark"
                      width="184"
                      height="56"
                      alt="Perigee"
                      style="display: block; width: 184px; max-width: 100%; height: auto; border: 0"
                    />
                  </div>
                  <!--<![endif]-->
                </div>
                <p
                  class="accent"
                  style="
                    margin: 0 0 12px;
                    font-size: 12px;
                    font-weight: bold;
                    line-height: 20px;
                    letter-spacing: 1px;
                    color: #b9482a;
                  "
                >
                  {{category}}
                </p>
                {{content}}
                <table role="presentation" width="100%" style="width: 100%">
                  <tr>
                    <td class="rule" style="padding-top: 24px; border-top: 1px solid #d5d9e0">
                      <img
                        src="cid:perigee-brandmark"
                        width="24"
                        height="24"
                        alt=""
                        role="presentation"
                        style="
                          display: block;
                          width: 24px;
                          height: 24px;
                          margin: 0 0 12px;
                          border: 0;
                        "
                      />
                      <p
                        class="muted"
                        style="margin: 0; font-size: 12px; line-height: 20px; color: #5f6775"
                      >
                        Perigee &middot; Your marketplace, connected.
                      </p>
                      <p
                        class="muted"
                        style="margin: 4px 0 0; font-size: 12px; line-height: 20px; color: #5f6775"
                      >
                        This is a service email about your Perigee account or order.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
